<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>段考電子時鐘看板</title>
    <!-- 引入 Noto Sans TC 字體 (建議部署時下載字體到本地，避免斷網時版面跑掉) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --sidebar-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-blue: #4299e1;
            --accent-orange: #ed8936;
            --accent-red: #f56565;
            --accent-green: #48bb78;
            --border-color: #e2e8f0;
            --highlight-bg: #ebf8ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* [改進] 完整的中文字體 fallback，斷網時也能正常顯示 */
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', 'PingFang TC', 'Heiti TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .main-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2vmin;
        }

        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-secondary);
            transition: all 0.2s;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .fullscreen-btn:hover {
            background: #fff;
            color: var(--text-primary);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* [新增] CSV 載入失敗警示 */
        .csv-warning {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fffbeb;
            border: 1px solid #f6ad55;
            color: #c05621;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 50;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            max-width: 360px;
            line-height: 1.4;
        }

        .digital-clock-container {
            text-align: center;
            margin-bottom: 3vh;
            position: relative;
            width: 100%;
        }

        .date-display {
            font-size: 4vmin;
            color: var(--text-secondary);
            margin-bottom: 1vh;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 15vmin;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }
        
        .calibration-toggle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .calibration-toggle:hover { opacity: 1; }

        .calibration-panel {
            margin-top: 10px;
            display: none;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            white-space: nowrap;
        }
        
        .calibration-panel.show { display: block; }

        .cal-btn {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            margin: 0 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        .cal-btn:hover { background: var(--highlight-bg); border-color: var(--accent-blue); }
        .cal-info { font-size: 0.9rem; color: var(--accent-blue); margin-top: 5px; font-weight: bold; }

        .canvas-wrapper {
            position: relative;
            width: 45vmin;
            height: 45vmin;
            max-width: 500px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .circle-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
        }

        .subject-title {
            font-size: 5vmin;
            font-weight: 700;
            margin-bottom: 0.5rem;
            white-space: nowrap;
        }

        .status-message {
            font-size: 2.5vmin;
            font-weight: 500;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .alert-area {
            position: absolute;
            bottom: 5vh;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none; 
        }

        .alert-text {
            font-size: 3vmin;
            font-weight: 700;
            color: var(--accent-red);
            animation: pulse 1.5s infinite;
            display: none; 
            background-color: rgba(240, 244, 248, 0.95); 
            padding: 10px 40px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            color: var(--text-primary);
            border-left: 5px solid var(--accent-blue);
            padding-left: 1rem;
        }

        .schedule-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .schedule-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .item-time {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .item-subject {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .schedule-item.past {
            opacity: 0.4;
            background-color: #f7fafc;
        }

        .schedule-item.active {
            background-color: var(--highlight-bg);
            border-color: var(--accent-blue);
            transform: translateX(-5px);
            box-shadow: 2px 4px 10px rgba(66, 153, 225, 0.1);
        }
        
        .schedule-item.active .item-subject {
            color: var(--accent-blue);
        }

        /* [新增] NoSleep 隱藏影片 */
        #nosleep-video {
            position: fixed;
            top: -1px;
            left: -1px;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -9999;
        }

        @media (max-width: 1024px) {
            .sidebar { width: 240px; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; border-left: none; border-top: 1px solid var(--border-color); }
            .main-section { height: 100vh; padding: 1rem; }
            .canvas-wrapper { width: 70vmin; height: 70vmin; }
            .fullscreen-btn { top: 10px; right: 10px; padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- [新增] NoSleep: 無聲影片，防止系統級休眠 -->
    <video id="nosleep-video" playsinline loop muted></video>

    <main class="main-section">
        <button class="fullscreen-btn" onclick="toggleFullscreen()">
            ⛶ 全螢幕
        </button>

        <!-- [新增] CSV 載入失敗時顯示的警示 -->
        <div class="csv-warning" id="csvWarning">
            ⚠️ 無法載入考程 CSV 檔案，目前顯示的是範例資料。請確認 exam_schedule.csv 與本頁面放在同一目錄，並透過 HTTP 伺服器開啟。
        </div>

        <div class="digital-clock-container">
            <div class="date-display" id="dateDisplay">--月--日 星期--</div>
            <div class="time-display" id="timeDisplay">00:00:00</div>
            
            <div class="calibration-toggle" onclick="toggleCalibration()">⚙️ 時間校正</div>
            
            <div class="calibration-panel" id="calibrationPanel">
                <button class="cal-btn" onclick="adjustTime(-10000)">-10秒</button>
                <button class="cal-btn" onclick="adjustTime(-1000)">-1秒</button>
                <button class="cal-btn" onclick="resetCalibration()">歸零</button>
                <button class="cal-btn" onclick="adjustTime(1000)">+1秒</button>
                <button class="cal-btn" onclick="adjustTime(10000)">+10秒</button>
                <div class="cal-info" id="calInfo">目前校正: 0 秒</div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="examCanvas"></canvas>
            <div class="circle-info">
                <div class="subject-title" id="centerSubject">載入中...</div>
                <div class="status-message" id="centerStatus">請確認 CSV 檔案</div>
            </div>
        </div>

        <div class="alert-area">
            <div class="alert-text" id="alertText"></div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>今日段考日程</h2>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
    </aside>

    <script>
        // --- 設定區 ---
        const CSV_FILE_PATH = 'exam_schedule.csv';
        
        let EXAM_DATA = [
            { start: "08:15", end: "09:00", subject: "範例:國文" },
            { start: "09:10", end: "09:55", subject: "範例:備課" },
            { start: "10:05", end: "10:50", subject: "範例:自然" },
            { start: "13:30", end: "14:15", subject: "範例:地理" },
        ];

        // --- 變數 ---
        const canvas = document.getElementById('examCanvas');
        const ctx = canvas.getContext('2d');
        let centerX, centerY, radius, lineWidth;
        let globalTimeOffset = 0; 
        let wakeLock = null;
        let csvLoaded = false; // [新增] 追蹤 CSV 載入狀態

        const COLORS = {
            blue: '#4299e1',
            orange: '#ed8936',
            red: '#f56565',
            green: '#48bb78',
            gray: '#e2e8f0',
            bg: '#f0f4f8',
            textSecondary: '#718096'  // [修正] 補上原本缺少的定義
        };

        // =============================================
        // [新增] NoSleep 防休眠模組
        // 原理：循環播放一段無聲的微型影片，
        // 讓系統認為有媒體正在播放，阻止 OS 層級的休眠。
        // 比 Wake Lock API 更可靠，能對付大屏的硬體待機。
        // =============================================
        const NOSLEEP_VIDEO = document.getElementById('nosleep-video');

        function createNoSleepSource() {
            // 極小的無聲 webm (Chrome/Edge/Firefox)
            const webm = "data:video/webm;base64,GkXfo0AgQoaBAUL3gQFC8oEEQvOBCEKCQAR3ZWJtQoeBAkKFgQIYU4BnQI0VSalmQCgq17FAAw9CQE2AQAZ3aGFtbXlXQUAGd2hhbW15RIlACECPQAAAAAAAFlSua0AxrkAu14EBY8WBAZyBACK1nEADdW5khkAFVl9WUDglhohAA1ZQOIOBAeBABrCBCLqBCB9DtnVB";
            // 極小的無聲 mp4 (Safari/iOS)
            const mp4 = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAACKBtZGF0AAACYQYF//9d3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE1NyByMjkwMSA3ZDBmZjIyIC0gSC4yNjQvTVBFRy00IEFWQyBjb2RlYyAtIENvcHlsZWZ0IDIwMDMtMjAxOSAtIGh0dHA6Ly93d3cudmlkZW9sYW4ub3JnL3gyNjQuaHRtbCAtIG9wdGlvbnM6IGNhYmFjPTAgcmVmPTEgZGVibG9jaz0wOjA6MCBhbmFseXNlPTB4MToweDEgbWU9ZXNhIHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTI1IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9MTAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yOC4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCB2YnZfbWF4cmF0ZT03NjggdmJ2X2J1ZnNpemU9MzAwMCBjcmZfbWF4PTAuMCBuYWxfaHJkPW5vbmUgZmlsbGVyPTAgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAA9liIQAV/0TAAYdeBTXzg8AAALhbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAACoAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAkx0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAACgAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAgAAAAIAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAAoAAAAAAABAAAAAAHEbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAB1MAAACAAVxAAAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAcm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAADJzdGJsAAAAJnN0c2QAAAAAAAAAAQAAABZhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAgACABIAAAASAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGP//AAAAMGF2Y0MBQsAK/+EAF2dCwAq5ZYQAAAM0AAADIDNAAAYMAAK4IAATwIAAAAoHmIFNAAAAAABhc3R0cwAAAAAAAAABAAAAAQAACAAAAAAcc3R0cwAAAAAAAAABAAAAAQAAAAAAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAEAAAABAAAAHHN0c3oAAAAAAAAAAAAAAAEAAAAGAAAAFHN0Y28AAAAAAAAAAQAAACw=";
            
            if (NOSLEEP_VIDEO.canPlayType('video/webm; codecs="vp8"')) {
                NOSLEEP_VIDEO.src = webm;
            } else {
                NOSLEEP_VIDEO.src = mp4;
            }
        }

        function enableNoSleep() {
            createNoSleepSource();
            const playPromise = NOSLEEP_VIDEO.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    console.warn('NoSleep: 自動播放被阻擋，等待使用者互動後重試');
                });
            }
        }

        function tryEnableNoSleep() {
            if (NOSLEEP_VIDEO.paused) {
                NOSLEEP_VIDEO.play().catch(() => {});
            }
        }

        // =============================================
        // 主要邏輯
        // =============================================
        async function init() {
            const savedOffset = localStorage.getItem('examClockOffset');
            if (savedOffset) {
                globalTimeOffset = parseInt(savedOffset);
                updateCalInfo();
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            await loadCSV();
            
            // [新增] CSV 載入失敗時顯示可見的警告
            if (!csvLoaded) {
                document.getElementById('csvWarning').style.display = 'block';
            }

            // [改進] 防休眠雙保險：Wake Lock API + NoSleep 無聲影片
            await requestWakeLock();
            enableNoSleep();

            // 監聽使用者互動，確保 NoSleep 能通過自動播放限制
            document.addEventListener('click', tryEnableNoSleep);
            document.addEventListener('touchstart', tryEnableNoSleep);

            renderSidebar();
            setInterval(updateLoop, 1000);
            updateLoop(); 
        }

        // --- Wake Lock ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock active');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock released');
                        wakeLock = null; // [修正] 釋放後歸零
                    });
                }
            } catch (err) {
                console.warn(`Wake Lock 無法啟用: ${err.name}, ${err.message}`);
            }
        }
        
        // [修正] 不再檢查 wakeLock !== null，頁面可見時無條件嘗試重新取鎖
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await requestWakeLock();
                tryEnableNoSleep();
            }
        });

        // --- Canvas RWD ---
        function resizeCanvas() {
            const wrapper = document.querySelector('.canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            radius = (Math.min(canvas.width, canvas.height) / 2) * 0.9;
            lineWidth = radius * 0.12;
            
            updateLoop();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`無法啟用全螢幕: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            tryEnableNoSleep(); // 趁使用者互動啟動 NoSleep
        }

        // --- CSV ---
        async function loadCSV() {
            try {
                const response = await fetch(CSV_FILE_PATH);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text(); 
                const lines = text.trim().split(/\r?\n/); 
                
                const newData = [];
                for (let line of lines) {
                    const parts = line.split(',');
                    if (parts.length >= 3) {
                        newData.push({
                            start: parts[0].trim(),
                            end: parts[1].trim(),
                            subject: parts[2].trim()
                        });
                    }
                }

                if (newData.length > 0) {
                    EXAM_DATA = newData;
                    csvLoaded = true;
                    console.log("CSV 載入成功", EXAM_DATA);
                }

            } catch (error) {
                console.warn("無法讀取 CSV 檔案，將使用預設/範例資料。", error);
                csvLoaded = false;
            }
        }

        // --- 校正 ---
        function toggleCalibration() {
            document.getElementById('calibrationPanel').classList.toggle('show');
        }

        function adjustTime(ms) {
            globalTimeOffset += ms;
            localStorage.setItem('examClockOffset', globalTimeOffset);
            updateCalInfo();
            updateLoop(); 
        }

        function resetCalibration() {
            globalTimeOffset = 0;
            localStorage.setItem('examClockOffset', 0);
            updateCalInfo();
            updateLoop();
        }

        function updateCalInfo() {
            const sec = globalTimeOffset / 1000;
            const sign = sec > 0 ? '+' : '';
            document.getElementById('calInfo').textContent = `目前校正: ${sign}${sec} 秒`;
        }

        // --- 主迴圈 ---
        function updateLoop() {
            let now = new Date();
            now = new Date(now.getTime() + globalTimeOffset);
            renderClock(now);
            renderStatus(now);
        }

        function renderClock(dateObj) {
            const timeStr = dateObj.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('timeDisplay').textContent = timeStr;
            
            const dateOptions = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateDisplay').textContent = dateObj.toLocaleDateString('zh-TW', dateOptions);
        }

        function renderStatus(now) {
            const nowTime = now.getTime();
            let activeSlot = null;
            let nextSlot = null;

            const schedule = EXAM_DATA.map(item => {
                const s = new Date(now);
                const [sH, sM] = item.start.split(':');
                s.setHours(parseInt(sH), parseInt(sM), 0, 0);

                const e = new Date(now);
                const [eH, eM] = item.end.split(':');
                e.setHours(parseInt(eH), parseInt(eM), 0, 0);

                return { ...item, startTime: s, endTime: e };
            });

            for (let i = 0; i < schedule.length; i++) {
                const slot = schedule[i];
                if (nowTime >= slot.startTime.getTime() && nowTime <= slot.endTime.getTime()) {
                    activeSlot = slot;
                    break;
                }
                if (nowTime < slot.startTime.getTime()) {
                    nextSlot = slot;
                    break;
                }
            }

            // 更新側邊欄
            schedule.forEach((slot, index) => {
                const el = document.getElementById(`slot-${index}`);
                if (!el) return;
                el.classList.remove('past', 'active');
                if (nowTime > slot.endTime.getTime()) {
                    el.classList.add('past');
                } else if (nowTime >= slot.startTime.getTime() && nowTime <= slot.endTime.getTime()) {
                    el.classList.add('active');
                }
            });

            const centerSubject = document.getElementById('centerSubject');
            const centerStatus = document.getElementById('centerStatus');
            const alertText = document.getElementById('alertText');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (centerX && centerY && radius) {
                drawArc(1, COLORS.gray);

                if (activeSlot) {
                    const totalDuration = activeSlot.endTime - activeSlot.startTime;
                    const elapsed = nowTime - activeSlot.startTime;
                    const remaining = activeSlot.endTime - nowTime;
                    const progress = elapsed / totalDuration;
                    const remainingMins = Math.ceil(remaining / 1000 / 60);

                    centerSubject.textContent = activeSlot.subject;
                    centerSubject.style.color = varToHex('--text-primary');

                    let mainColor = COLORS.blue;
                    let statusText = `剩餘 ${remainingMins} 分鐘`;
                    let alertMsg = "";
                    let alertShow = false;

                    if (activeSlot.subject.includes("備課")) {
                        mainColor = COLORS.green;
                        statusText = "準備下一節考試";
                        centerSubject.style.color = COLORS.green;
                    } else {
                        if (remainingMins <= 5) {
                            mainColor = COLORS.red;
                            alertMsg = `⚠️ ${activeSlot.subject} 考試即將結束！請檢查試卷`;
                            alertShow = true;
                        } else if (remainingMins <= 10) {
                            mainColor = COLORS.orange;
                            alertMsg = `🔔 注意時間：剩餘 ${remainingMins} 分鐘`;
                            alertShow = true;
                        }
                    }

                    centerStatus.textContent = statusText;
                    centerStatus.style.color = mainColor;
                    drawArc(progress, mainColor);

                    if (alertShow) {
                        alertText.textContent = alertMsg;
                        alertText.style.display = 'block';
                    } else {
                        alertText.style.display = 'none';
                    }

                } else if (nextSlot) {
                    centerSubject.textContent = "休息中";
                    centerStatus.textContent = `下節：${nextSlot.subject} (${nextSlot.start})`;
                    centerStatus.style.color = COLORS.textSecondary; // [修正] 現在有正確的值
                    alertText.style.display = 'none';
                    drawArc(0, COLORS.blue);

                } else {
                    const lastSlot = schedule[schedule.length - 1];
                    if (lastSlot && nowTime > lastSlot.endTime.getTime()) {
                        centerSubject.textContent = "今日結束";
                        centerStatus.textContent = "辛苦了！";
                        centerStatus.style.color = COLORS.green;
                        drawArc(1, COLORS.green);
                    } else {
                        centerSubject.textContent = "準備中";
                        centerStatus.textContent = "";
                    }
                    alertText.style.display = 'none';
                }
            }
        }

        function drawArc(percentage, color) {
            if (percentage <= 0) return;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI * percentage);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        function renderSidebar() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';
            EXAM_DATA.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'schedule-item';
                div.id = `slot-${index}`;
                div.innerHTML = `
                    <span class="item-time">${item.start} - ${item.end}</span>
                    <span class="item-subject">${item.subject}</span>
                `;
                list.appendChild(div);
            });
        }

        function varToHex(varName) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        }

        window.onload = init;
    </script>
</body>
</html>
